name: Weekly Intelligence Report

on:
  schedule:
    # 11:00 UTC every Monday = 7:00 AM EDT / 6:00 AM EST.
    # A fixed UTC cron drifts an hour across the DST boundary — see README
    # "Scheduling trade-off" for why a single cron entry was chosen anyway.
    - cron: "0 11 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check src/

      - name: Run tests
        run: pytest -q

      - name: Generate weekly report
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
          REPORT_RECIPIENTS: ${{ secrets.REPORT_RECIPIENTS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_FROM: ${{ secrets.SENDGRID_FROM }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          FUB_API_KEY: ${{ secrets.FUB_API_KEY }}
        run: python -m src.main

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: doyouneedahome-intelligence-report
          path: reports/*
          retention-days: 90

      - name: Commit report + historical data back to the repo
        run: |
          git config user.name "doyouneedahome-intelligence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/ data/historical/
          git diff --cached --quiet || git commit -m "Weekly intelligence report — $(date -u +%Y-%m-%d)"
          git push
