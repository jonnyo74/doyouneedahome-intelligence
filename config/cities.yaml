      - {slug: "jupiter-country-club", name: "Jupiter Country Club", tags: [golf], confidence: high}
      - {slug: "sonoma-isles", name: "Sonoma Isles", tags: [gated], confidence: high}
      - {slug: "jupiter-island", name: "Jupiter Island", tags: [waterfront, luxury], confidence: high}
