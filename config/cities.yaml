# City/market configuration.
#
# `slug` must match the live /communities/{slug} path.
# `known_communities` seeds the city → community mapping used by
# city_scorecards.py. `confidence: high` means I verified this mapping by
# hand against public knowledge of the community's real location.
# `confidence: seed` means it's a reasonable first guess from the sitemap
# alone and should be confirmed/reclassified by the crawler's city-name
# text-match against the live page (see src/city_scorecards.py). Anything
# the crawler can't confirm gets reported as "unmapped" rather than trusted
# silently — never invent the mapping.
#
# `tags` on a community are only added where there's real evidence (a golf
# club, a waterfront address, a known new-construction project, etc.) — they
# drive which scorecard categories are "applicable" for that city. Don't add
# a category to a city just because it's common elsewhere.

# Repeatable per-city blog template actually used on the site (see
# /blog/what-its-really-like-living-in-jupiter-florida etc.). {city} is
# replaced with the city slug.
blog_template:
  - "what-its-really-like-living-in-{city}-florida"
  - "local-guide-to-{city}-florida"
  - "best-neighborhoods-in-{city}-florida"
  - "best-things-to-do-in-{city}-florida"
  - "who-should-move-to-{city}-florida"
  - "pros-and-cons-of-living-in-{city}-florida"
  - "cost-of-living-in-{city}-florida"
  - "hidden-gems-in-{city}-florida"
  - "{city}-vs-nearby-cities"
  - "best-places-to-eat-drink-hang-out-in-{city}-florida"

cities:
